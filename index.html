<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="google"
    content="notranslate"
  >

  <title>الباقية</title>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #f7f5ef;
    }


    #albaqiaApp {
      width: 100%;

      height: 100vh;
      height: 100dvh;

      border: 0;

      display: block;

      background: #f7f5ef;
    }




  </style>

</head>


<body>


  <iframe
    id="albaqiaApp"
    title="الباقية"
    allow="autoplay">
  </iframe>




  <script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzUSf-7s34cW5L0cFliTOOlVgjj2wnmWWhwvdJAK-xiRRIwrKvuswKzH1bpbEfM4BpLkg/exec";
    /* ========================================
       قراءة الرابط
    ======================================== */

const path =
  window.location.pathname
    .replace(
      /^\/+|\/+$/g,
      ""
    );


    const params =
      new URLSearchParams(
        window.location.search
      );
if (
  params.get("clearPending") === "1"
) {

  localStorage.removeItem(
    "albaqiaPendingOrder"
  );

}

    const pendingOrderId =
      localStorage.getItem(
        "albaqiaPendingOrder"
      );


    let appUrl =
      APPS_SCRIPT_URL;


    /* ========================================
       Bridge قديم / احتياطي
       albaqia.com/?action=pay
    ======================================== */

    const paymentAction =
      params.get(
        "action"
      );


    if (
      paymentAction === "pay"
    ) {

      const pendingOrder =
        String(
          params.get(
            "order"
          ) || ""
        ).trim();


      const paymentUrl =
        String(
          params.get(
            "paymentUrl"
          ) || ""
        ).trim();


      if (
        pendingOrder &&
        paymentUrl
      ) {

        localStorage.setItem(
          "albaqiaPendingOrder",
          pendingOrder
        );


        window.location.replace(
          paymentUrl
        );

      }

    }


    /* ========================================
       لوحة الإدارة
       albaqia.com/admin
    ======================================== */

    if (
      path.toLowerCase() ===
      "admin"
    ) {

      appUrl +=
        "?action=admin";


      document.title =
        "لوحة إدارة الباقية";

    }


    /* ========================================
       رجوع EasyKash
    ======================================== */

    else if (
      params.get(
        "action"
      ) === "easykash_return"
    ) {

      const order =
        params.get(
          "order"
        );


      appUrl +=
        "?action=easykash_return";


      if (order) {

        appUrl +=
          "&order=" +
          encodeURIComponent(
            order
          );

      }


      document.title =
        "تأكيد الدفع | الباقية";

    }


    /* ========================================
       استكمال بيانات الطلب
    ======================================== */

    else if (
      params.get(
        "action"
      ) === "complete_order"
    ) {

      const order =
        params.get(
          "order"
        );


      appUrl +=
        "?action=complete_order";


      if (order) {

        appUrl +=
          "&order=" +
          encodeURIComponent(
            order
          );

      }


      document.title =
        "استكمال بيانات الطلب | الباقية";

    }


    /* ========================================
       الرجوع يدويًا من EasyKash
    ======================================== */


/* ========================================
   استكمال بيانات الطلب - الدفع اليدوي
======================================== */

else if (
  params.get(
    "action"
  ) === "manual_complete_order"
) {

  const order =
    params.get(
      "order"
    );


  appUrl +=
    "?action=manual_complete_order";


  if (order) {

    appUrl +=
      "&order=" +
      encodeURIComponent(
        order
      );

  }


  document.title =
    "استكمال بيانات الطلب | الباقية";

}
/* ========================================
   Manifest
======================================== */

else if (
  params.get(
    "action"
  ) === "manifest"
) {

  const page =
    params.get(
      "page"
    );


  appUrl +=
    "?action=manifest";


  if (page) {

    appUrl +=
      "&page=" +
      encodeURIComponent(
        page
      );

  }


  document.title =
    "الباقية";

}
    /* ========================================
       صفحات المتوفين / Landing
    ======================================== */

else {

if (
  pendingOrderId &&
  !params.get("payment")
) {
    appUrl +=
      "?action=easykash_return" +
      "&order=" +
      encodeURIComponent(
        pendingOrderId
      );

    document.title =
      "تأكيد الدفع | الباقية";

  } else {

const page =
  params.get(
    "page"
  ) ||
  "";


      if (page) {

        appUrl +=
          "?page=" +
          encodeURIComponent(
            page
          );

        }

    }

  }


    /* ========================================
       تشغيل تطبيق الباقية
    ======================================== */
    document
      .getElementById(
        "albaqiaApp"
      )
      .src =
      appUrl;


  

window.addEventListener(
  "message",
  function(event) {

    if (
      !event.data ||
      event.data.type !==
        "ALBAQIA_PAYMENT_RETURN"
    ) {
      return;
    }

    const orderId =
      String(
        event.data.orderId || ""
      ).trim();

    const paid =
      event.data.paid === true;

    const targetUrl =
      String(
        event.data.targetUrl || ""
      ).trim();

    if (paid) {

      localStorage.removeItem(
        "albaqiaPendingOrder"
      );

    }

if (
  targetUrl &&
  targetUrl.startsWith(
    "https://albaqia.com/"
  )
) {

  window.location.replace(
    targetUrl
  );

}

  }
);


window.addEventListener(
  "pageshow",
  function(event) {

    if (event.persisted) {

      window.location.reload();

    }

  }
);

  </script>


</body>

</html>
