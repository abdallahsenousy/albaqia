<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta
    name="google"
    content="notranslate">

  <title>الباقية</title>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #f7f5ef;

    }


    #albaqiaApp {

      width: 100%;

      height: 100vh;
      height: 100dvh;

      border: 0;

      display: block;

      background: #f7f5ef;

    }

  </style>

</head>


<body>


  <iframe
    id="albaqiaApp"
    title="الباقية"
    allow="autoplay">
  </iframe>


  <script>

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzUSf-7s34cW5L0cFliTOOlVgjj2wnmWWhwvdJAK-xiRRIwrKvuswKzH1bpbEfM4BpLkg/exec";


    /* ========================================
       قراءة الرابط
    ======================================== */

    const path =
      window.location.pathname
        .replace(
          /^\/+|\/+$/g,
          ""
        );


    const params =
      new URLSearchParams(
        window.location.search
      );


    let appUrl =
      APPS_SCRIPT_URL;

    const pendingOrderId =
  localStorage.getItem(
    "albaqiaPendingOrder"
  );

    /* ========================================
       لوحة الإدارة
       albaqia.com/admin
    ======================================== */

    if (
      path.toLowerCase() ===
      "admin"
    ) {

      appUrl +=
        "?action=admin";

      document.title =
        "لوحة إدارة الباقية";

    }

      else if (
  params.get("action") ===
  "easykash_return"
) {

  const order =
    params.get(
      "order"
    );

  appUrl +=
    "?action=easykash_return";

  if (order) {

    appUrl +=
      "&order=" +
      encodeURIComponent(
        order
      );

  }

  document.title =
    "تأكيد الدفع | الباقية";

}

else if (
  params.get("action") ===
  "complete_order"
) {

  const order =
    params.get(
      "order"
    );

  appUrl +=
    "?action=complete_order";

  if (order) {

    appUrl +=
      "&order=" +
      encodeURIComponent(
        order
      );

  }

  document.title =
    "استكمال بيانات الطلب | الباقية";

}
    /* ========================================
       صفحات المتوفين
    ======================================== */

    else {

      const page =
        path ||
        params.get(
          "page"
        );


      if (page) {

        appUrl +=
          "?page=" +
          encodeURIComponent(
            page
          );

      }

    }


    /* ========================================
       تشغيل تطبيق الباقية
    ======================================== */

    document
      .getElementById(
        "albaqiaApp"
      )
      .src =
      appUrl;

    window.addEventListener(
  "message",
  function(event) {

    if (
      !event.data ||
      event.data.type !==
        "ALBAQIA_PAYMENT_STARTED"
    ) {
      return;
    }

    const orderId =
      String(
        event.data.orderId || ""
      ).trim();

    if (!orderId) {
      return;
    }

    localStorage.setItem(
      "albaqiaPendingOrder",
      orderId
    );

  }
);
    
  </script>


</body>

</html>
