<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta
    name="google"
    content="notranslate">

  <title>الباقية</title>
<script>

(function() {

  const cleanPath =
    window.location.pathname
      .replace(
        /^\/+|\/+$/g,
        ""
      );


  const query =
    new URLSearchParams(
      window.location.search
    );


  const page =
    (
      cleanPath &&
      cleanPath.toLowerCase() !==
        "admin"
    )
      ? cleanPath
      : String(
          query.get("page") ||
          ""
        ).trim();


  function addManifest() {

    const oldManifest =
      document.querySelector(
        'link[rel="manifest"]'
      );


    if (oldManifest) {
      oldManifest.remove();
    }


    const manifest =
      document.createElement(
        "link"
      );


    manifest.rel =
      "manifest";


    manifest.href =
      "/manifest.webmanifest" +
      (
        page
          ? "?page=" +
            encodeURIComponent(
              page
            )
          : ""
      );


    document.head.appendChild(
      manifest
    );

  }


  if (
    !(
      "serviceWorker" in
      navigator
    )
  ) {

    addManifest();

    return;

  }


  navigator.serviceWorker
    .register(
      "/sw.js",
      {
        scope: "/",
        updateViaCache: "none"
      }
    )
    .then(
      function(registration) {

        return registration
          .update();

      }
    )
    .then(
      function() {

        return navigator
          .serviceWorker
          .ready;

      }
    )
    .then(
      function() {

        if (
          navigator.serviceWorker
            .controller
        ) {

          addManifest();

          return;

        }


        const alreadyReloaded =
          sessionStorage
            .getItem(
              "albaqiaSwReloaded"
            );


        if (
          alreadyReloaded !==
            "1"
        ) {

          sessionStorage
            .setItem(
              "albaqiaSwReloaded",
              "1"
            );

          window.location
            .reload();

          return;

        }


        addManifest();

      }
    )
    .catch(
      function() {

        addManifest();

      }
    );

})();

</script>
 
  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="/albaqia-icon-192.png">

  <link
    rel="apple-touch-icon"
    href="/albaqia-icon-512.png">

  <meta
    name="theme-color"
    content="#123f36">


  <script>

    window.deferredInstallPrompt =
      null;


    window.addEventListener(
      "beforeinstallprompt",
      function(event) {

        event.preventDefault();

        window.deferredInstallPrompt =
          event;

      }
    );

  </script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #f7f5ef;

    }


    #albaqiaApp {

      width: 100%;

      height: 100vh;
      height: 100dvh;

      border: 0;

      display: block;

      background: #f7f5ef;

    }

  </style>

</head>


<body>


  <iframe
    id="albaqiaApp"
    title="الباقية"
    allow="autoplay">
  </iframe>


  <script>

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzUSf-7s34cW5L0cFliTOOlVgjj2wnmWWhwvdJAK-xiRRIwrKvuswKzH1bpbEfM4BpLkg/exec";


    /* ========================================
       تسجيل Service Worker
    ======================================== */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        function() {

          navigator.serviceWorker
            .register(
              "/sw.js"
            )
            .catch(
              function(error) {

                console.error(
                  "Service Worker Error:",
                  error
                );

              }
            );

        }
      );

    }


    /* ========================================
       قراءة الرابط
    ======================================== */

    const path =
      window.location.pathname
        .replace(
          /^\/+|\/+$/g,
          ""
        );


    const params =
      new URLSearchParams(
        window.location.search
      );


    let appUrl =
      APPS_SCRIPT_URL;


    /* ========================================
       لوحة الإدارة
    ======================================== */

    if (
      path.toLowerCase() ===
      "admin"
    ) {

      appUrl +=
        "?action=admin";

      document.title =
        "لوحة إدارة الباقية";

    }


    /* ========================================
       صفحة المتوفى
    ======================================== */

    else {

      const page =
        path ||
        params.get(
          "page"
        );


      if (page) {

        appUrl +=
          "?page=" +
          encodeURIComponent(
            page
          );

      }

    }


    /* ========================================
       تشغيل الباقية
    ======================================== */

    const albaqiaFrame =
      document.getElementById(
        "albaqiaApp"
      );


    albaqiaFrame.src =
      appUrl;


    /* ========================================
       استقبال طلب التثبيت
    ======================================== */

    window.addEventListener(
      "message",
      async function(event) {

        if (
          !event.data ||
          event.data.type !==
            "ALBAQIA_INSTALL_REQUEST"
        ) {
          return;
        }


        /* التثبيت المباشر لو متاح */

        if (
          window.deferredInstallPrompt
        ) {

          window.deferredInstallPrompt
            .prompt();

          try {

            await window
              .deferredInstallPrompt
              .userChoice;

          }
          catch (error) {
          }


          window.deferredInstallPrompt =
            null;

          return;

        }


        /* الحل المضمون */

        alert(
          "لإضافة صفحة المتوفى إلى الشاشة الرئيسية:\n\n" +
          "1- اضغط على ⋮ أعلى Chrome\n" +
          "2- اختر «التثبيت وإنشاء اختصار»\n" +
          "3- اختر «إنشاء اختصار»\n" +
          "4- اضغط «إضافة»"
        );

      }
    );

  </script>


</body>

</html>
